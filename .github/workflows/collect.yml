name: collect

# Twice an hour, two polls per run, fifteen minutes apart.
#
# Polls land at :03, :18, :33 and :48 — the same four an hour the
# pre-registration assumes, but reached by two independent cron windows rather
# than one. GitHub's scheduler is best-effort: it runs late under load and drops
# windows outright, and the very first window on this repository never fired at
# all. With a single hourly entry, one dropped window costs four polls. With two,
# it costs two, and the hour is never silent unless both are dropped.
#
# Two polls per job rather than one keeps runner setup from dominating a
# sixty-second sweep, and keeps commit volume at 48/day rather than 96.
#
# Each job runs about sixteen minutes (poll, wait, poll), so the :03 and :33
# windows cannot overlap. The concurrency group below covers the case where one
# runs long anyway.
#
# Every record is stamped when it is observed, never when it was scheduled, so
# a late window shifts the data's timestamps rather than misrepresenting them.

on:
  schedule:
    - cron: "3 * * * *"
    - cron: "33 * * * *"
  workflow_dispatch:
    inputs:
      polls:
        description: "Polls to run"
        default: "1"
      interval:
        description: "Seconds between polls"
        default: "900"

# Never let a late run collide with the next one.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # A normal job is ~16 minutes. Two poll budgets plus setup is the ceiling.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Poll the network
        run: |
          python -m downwind.collect \
            --data-dir data/raw \
            --polls "${{ github.event.inputs.polls || '2' }}" \
            --interval "${{ github.event.inputs.interval || '900' }}"

      - name: Commit whatever was collected
        run: |
          git config user.name  "downwind-collector"
          git config user.email "downwind-collector@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "nothing collected this run"
            exit 0
          fi
          git commit -m "collect: $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another run may have landed while this one was polling.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep 10
          done
          exit 1
