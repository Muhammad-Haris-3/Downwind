name: diagnose

# Temporary. The runner reaches the API fine with curl (200 in 0.58s) but the
# collector timed out on the same endpoint. This isolates which difference
# matters: the User-Agent, the HTTP client, or neither.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: curl with a browser User-Agent
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null --max-time 45 \
              -H 'Origin: https://aqi.punjab.gov.pk' \
              -H 'Referer: https://aqi.punjab.gov.pk/' \
              -H 'User-Agent: Mozilla/5.0' \
              -w "browser-UA try$i code=%{http_code} total=%{time_total}s\n" \
              https://aqi.punjab.gov.pk/api/districts || echo "try$i FAILED rc=$?"
          done

      - name: curl with the collector's User-Agent
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null --max-time 45 \
              -H 'Origin: https://aqi.punjab.gov.pk' \
              -H 'Referer: https://aqi.punjab.gov.pk/' \
              -H 'User-Agent: Downwind/0.1 (research collector; contact via repository)' \
              -w "downwind-UA try$i code=%{http_code} total=%{time_total}s\n" \
              https://aqi.punjab.gov.pk/api/districts || echo "try$i FAILED rc=$?"
          done

      - name: python urllib, exactly as the collector calls it
        run: |
          python - <<'PY'
          import time, urllib.request, json
          from downwind.collect import HEADERS, BASE_URL

          for label, headers in (
              ("collector headers", HEADERS),
              ("browser UA", {**HEADERS, "User-Agent": "Mozilla/5.0"}),
          ):
              for attempt in (1, 2, 3):
                  started = time.monotonic()
                  try:
                      req = urllib.request.Request(f"{BASE_URL}/districts", headers=headers)
                      with urllib.request.urlopen(req, timeout=45) as r:
                          body = r.read()
                      print(f"{label} try{attempt}: {r.status} "
                            f"{len(body)}b in {time.monotonic()-started:.2f}s")
                  except Exception as exc:
                      print(f"{label} try{attempt}: FAILED after "
                            f"{time.monotonic()-started:.2f}s -> {type(exc).__name__}: {exc}")
          PY

      - name: the real collector, one district
        run: |
          python - <<'PY'
          import time
          from downwind import collect

          started = time.monotonic()
          try:
              districts = collect.fetch_districts()
              print(f"fetch_districts: {len(districts)} in {time.monotonic()-started:.2f}s")
          except Exception as exc:
              print(f"fetch_districts FAILED in {time.monotonic()-started:.2f}s -> {exc}")
              raise SystemExit(0)

          started = time.monotonic()
          poll = collect.poll_once(delay=0.25)
          print(f"poll_once: {len(poll.readings)} readings, "
                f"{len(poll.failures)} failures in {time.monotonic()-started:.2f}s")
          for f in poll.failures[:5]:
              print("  failure:", f["target"], "->", f["error"][:120])
          PY
